name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml', 'scripts/probe.py']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl
      - run: |
          mkdir raw
          B=https://www.mhlw.go.jp/content/10800000
          for f in 001299890.xlsx 001299921.xlsx 001299988.zip; do
            curl -fsSL -A "Mozilla/5.0" -o raw/$f $B/$f
          done
          ls -l raw
      - run: python scripts/probe.py
      - run: |
          mkdir out && mv probe.json out/ && cd out
          git init -q -b probe
          git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -q -m probe
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} probe
