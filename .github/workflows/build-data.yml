name: build-data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-data.yml', 'scripts/build_data.py']
permissions:
  contents: write
concurrency: build-data
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl pypdf
      - name: 厚生労働省から令和6年度公表データを取得
        run: |
          mkdir raw
          B=https://www.mhlw.go.jp/content/10800000
          get() { curl -fsSL --retry 3 -A "Mozilla/5.0" -o "raw/$2" "$B/$1"; }
          get 001299890.xlsx facility.xlsx
          get 001299988.zip notes.zip
          get 001299957.xlsx form2.xlsx
          for n in 892 893 894 895 901 914 921; do get 001299$n.xlsx ward_$n.xlsx; done
          ls -l raw
      - run: python scripts/build_data.py raw data
      - name: 生成データをコミット
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add data
          git diff --cached --quiet || git commit -m "Update data [skip ci]"
          git pull --rebase -q && git push
